name: Lantern
packages:
  LanternIdentity:
    path: AppleIdentity
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.lantern.poc
    SWIFT_VERSION: '5.0'
targets:
  Lantern:
    type: application
    platform: iOS
    sources: [LanternApp.swift, IosPairingService.swift, HandshakeV1Channel.swift]
    dependencies:
      - package: LanternIdentity
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Simulator.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS: '$(inherited) -framework LanternUI -lsqlite3'
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          bash ./gradlew :ui:embedAndSignAppleFrameworkForXcode
  LanternIdentityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Lantern
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.lantern.poc.identity-tests
        # Tests import the bridge API; the static framework remains linked only by the host app.
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
  LanternBootstrapInteropTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InteropTests]
    dependencies:
      - target: Lantern
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.lantern.poc.bootstrap-interop-tests
        FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        LANTERN_INTEROP_CONTROL: ''
schemes:
  Lantern:
    build:
      targets:
        Lantern: all
    test:
      targets: [LanternIdentityTests]
  LanternBootstrapInterop:
    build:
      targets:
        Lantern: all
    test:
      targets: [LanternBootstrapInteropTests]
      environmentVariables:
        LANTERN_INTEROP_CONTROL: '$(LANTERN_INTEROP_CONTROL)'
