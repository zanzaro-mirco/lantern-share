name: Lantern
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.lantern.poc
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
    OTHER_LDFLAGS: '$(inherited) -framework LanternUI'
targets:
  Lantern:
    type: application
    platform: iOS
    sources: [LanternApp.swift]
    settings:
      base:
        INFOPLIST_FILE: Info.plist
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          bash ./gradlew :ui:embedAndSignAppleFrameworkForXcode
schemes:
  Lantern:
    build:
      targets:
        Lantern: all
